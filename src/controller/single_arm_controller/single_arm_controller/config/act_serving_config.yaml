# act_serving_orchestrator.py / act_policy_server.py 공통 설정
# 이 파일의 값이 스크립트 하드코딩 상수를 대체한다.

# ── 환경 ────────────────────────────────────────────────────────────────────
env:
  venv_path:            /home/jr/ws/physical-ai-repo-3/.venv
  mediapipe_model_path: /home/jr/ws/physical-ai-repo-3/models/hand_landmarker.task

# ── 모델 ────────────────────────────────────────────────────────────────────
model:
  pickup_path: /home/jr/ws/lerobot/outputs/act_pickup/600000/pretrained_model
  serving_path: /home/jr/ws/lerobot/outputs/act_serving/with_palm/400000/pretrained_model
  device:      cuda
  robot_type:  omx_follower

# ── 제어 ────────────────────────────────────────────────────────────────────
control:
  hz:                    30.0   # 목표 제어 주파수
  interpolation_mult:    3      # 보간 배수 (30Hz × 3 = 90Hz sub-step)
  ema_alpha:             0.43   # gripper EMA (arm 관절에는 미적용)
  inference_queue_refill_threshold: 30  # 큐가 이 값 이하일 때 다음 추론 트리거

# ── 태스크 지속시간 ──────────────────────────────────────────────────────────
# 0이면 무제한 (홈 포지션 감지 또는 수동 취소로 종료)
task:
  serve_duration_s:   60.0
  pickup_duration_s:  60.0

# ── Shared Memory 레이아웃 ──────────────────────────────────────────────────
# act_serving_orchestrator.py와 act_policy_server.py가 반드시 동일한 값을 사용해야 한다.
memory:
  chunk_size:  100   # ACT config.chunk_size (모델 학습 설정과 일치)
  action_dim:  6     # 관절 수
  state_dim:   6     # 관절 상태 차원
  top_shape:   [480, 640, 3]
  wrist_shape: [480, 640, 3]

# ── 내부 추론 IPC ───────────────────────────────────────────────────────────
# ACT policy server는 별도 ROS 노드로 실행된다. 대용량 이미지/action chunk는
# shared memory로 교환하고, ROS service는 추론 trigger/완료 응답만 담당한다.
ipc:
  service_name:          /act_policy/infer
  set_task_service_name: /act_policy/set_task
  shm_obs_name:          act_policy_observation
  shm_act_name:          act_policy_action
  connect_timeout_s:     120.0

# ── 카메라 ──────────────────────────────────────────────────────────────────
cameras:
  top_path:    /dev/video0
  wrist_path:  /dev/video2
  palm_index:  4
  width:       640
  height:      480
  fps:         30

# ── 로봇 하드웨어 ────────────────────────────────────────────────────────────
robot:
  port:      /dev/ttyACM0
  baud:      1000000
  motor_ids: [11, 12, 13, 14, 15, 16]
  protocol:  2.0
  dxl_max:   4095

# ── 홈 포지션 감지 ───────────────────────────────────────────────────────────
# 작업 완료 감지 기준. 관절 인덱스: 0=shoulder_pan, 1=shoulder_lift,
# 2=elbow_flex, 3=wrist_flex, 4=wrist_roll, 5=gripper
home:
  dwell_s: 2.0
  return_duration_s: 3.0   # 추론 종료 후 초기 위치 복귀 소요 시간(s)
  ranges:
    0: [-8.0,   8.0]    # shoulder_pan   (홈:  -1.0  → 태스크 중 크게 이동)
    1: [-75.0, -55.0]   # shoulder_lift  (홈: -65.42)
    2: [45.0,   65.0]   # elbow_flex     (홈:  54.87)
    4: [-11.0,   9.0]   # wrist_roll     (홈:  -1.05)

# ── 디버그 / 시각화 ──────────────────────────────────────────────────────────
debug:
  rerun_enabled: false   # true이면 추론 중 top/wrist 카메라를 rerun viewer에 표시
  rerun_log_every_n: 9  # N step마다 1번 로깅 (30Hz÷9≈3.3Hz). 크게 할수록 렉 감소

# ── 형광등 줄무늬 오버레이 ──────────────────────────────────────────────────────
# 학습 데이터(top view)에 포함된 형광등 플리커 줄무늬를 추론 시 재현.
# 파라미터는 file-000.mp4 분석 결과 (주기 120px, 진폭 24.4, 위상 2.845 rad).
banding_overlay:
  enabled:    true
  period_px:  120.0
  amplitude:  24.4
  phase_rad:  2.845

# ── VLM 완료 판단 ────────────────────────────────────────────────────────────
# 홈 포지션 dwell_s 경과 후 top 카메라 이미지를 VLM에 보내 완료 여부 확인.
# enabled: false이면 홈 포지션 감지만으로 완료 판단 (VLM 없이).
vlm:
  enabled:   flase
  host:      http://192.168.0.133:11434   # Ollama 서버
  model:     qwen3-vl:4b
  timeout_s: 30.0
  # 태스크마다 프롬프트를 바꿔서 완료 조건을 정의한다.
  # VLM이 "false"로 시작하는 답을 반환하면 complete=True로 판단한다.
  serve_prompt: >-
    In the image, is there a container in the yellow zone on the left side?
    Answer with only "true" or "false".
  pickup_prompt: >-
    In the image, has the object been picked up and is no longer in the
    white zone on the right side? Answer with only "true" or "false".
