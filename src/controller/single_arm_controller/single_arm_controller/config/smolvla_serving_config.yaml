# smolvla_serving_orchestrator.py / smolvla_policy_worker.py 공통 설정

# ── 환경 ────────────────────────────────────────────────────────────────────
env:
  venv_path:            /home/jr/ws/physical-ai-repo-3/.venv
  mediapipe_model_path: /home/jr/ws/physical-ai-repo-3/models/hand_landmarker.task

# ── 모델 ────────────────────────────────────────────────────────────────────
model:
  pickup_path:  /home/jr/ws/lerobot/outputs/smolvla_serving_with_palm/075000/pretrained_model
  serving_path: /home/jr/ws/lerobot/outputs/smolvla_serving_with_palm/075000/pretrained_model
  device:       cuda
  robot_type:   omx_follower

# ── 태스크 언어 설명 ─────────────────────────────────────────────────────────
# SmolVLA는 자연어 태스크 설명을 관찰값과 함께 입력받는다.
tasks:
  pickup_task_text:        "pick up the object and place it at the target zone"
  serve_no_drink_task_text: "serve without drink"
  serve_left_task_text:    "serve the drink to the left"
  serve_right_task_text:   "serve the drink to the right"

# ── 제어 ────────────────────────────────────────────────────────────────────
control:
  hz:                    30.0
  interpolation_mult:    3       # 보간 배수 (30Hz × 3 = 90Hz sub-step)
  ema_alpha:             0.43    # gripper EMA (arm 관절에는 미적용)
  inference_queue_refill_threshold: 30

# ── 태스크 지속시간 ──────────────────────────────────────────────────────────
# 0이면 무제한 (홈 포지션 감지 또는 수동 취소로 종료)
task:
  serve_duration_s:  60.0
  pickup_duration_s: 60.0

# ── Shared Memory 레이아웃 ──────────────────────────────────────────────────
# smolvla_serving_orchestrator.py와 smolvla_policy_worker.py가 반드시 동일한 값을 사용해야 한다.
memory:
  chunk_size:        50    # SmolVLA 기본 chunk_size (모델 실제 출력 확인 후 맞출 것)
  action_dim:        6
  state_dim:         6
  top_shape:         [480, 640, 3]
  wrist_shape:       [480, 640, 3]
  execution_horizon: 15   # RTC prev_chunk_left_over 정규화 길이 (lerobot 기본값)

# ── 내부 추론 IPC ───────────────────────────────────────────────────────────
ipc:
  service_name:          /smolvla_policy/infer
  set_task_service_name: /smolvla_policy/set_task
  shm_obs_name:          smolvla_policy_observation
  shm_act_name:          smolvla_policy_action
  shm_prev_name:         smolvla_policy_prev_chunk
  connect_timeout_s:     120.0

# ── 카메라 ──────────────────────────────────────────────────────────────────
cameras:
  top_path:   /dev/video2
  wrist_path: /dev/video0
  palm_index: 4
  width:      640
  height:     480
  fps:        30

# ── 로봇 하드웨어 ────────────────────────────────────────────────────────────
robot:
  port:      /dev/ttyACM0
  baud:      1000000
  motor_ids: [11, 12, 13, 14, 15, 16]
  protocol:  2.0
  dxl_max:   4095

# ── 홈 포지션 감지 ───────────────────────────────────────────────────────────
home:
  dwell_s: 2.0
  return_duration_s: 3.0
  ranges:
    0: [-8.0,   8.0]
    1: [-75.0, -55.0]
    2: [45.0,   65.0]
    4: [-11.0,   9.0]

# ── VLM 완료 판단 ────────────────────────────────────────────────────────────
vlm:
  enabled:   true
  host:      http://192.168.0.133:11434
  model:     qwen3-vl:4b
  timeout_s: 30.0
  serve_prompt: >-
    In the image, is there a container in the yellow zone on the left side?
    Answer with only "true" or "false".
  pickup_prompt: >-
    In the image, has the object been picked up and is no longer in the
    white zone on the right side? Answer with only "true" or "false".
