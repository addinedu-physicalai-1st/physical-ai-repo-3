# 5090 서버 (192.168.0.133) — moca LAN chrony master
# 배치: /etc/chrony/conf.d/moca.conf  (또는 /etc/chrony/chrony.conf 끝에 추가)

# 인터넷 NTP 풀 (가능 시 stratum 받기)
pool kr.pool.ntp.org iburst

# LAN 마스터 — 인터넷 끊겨도 stratum 8 로 LAN serve 유지
local stratum 8

# LAN 클라이언트 (노트북 3 + 로봇 2) 허용
allow 192.168.0.0/24

# 부팅 직후 3회까지 1초 이상 차이도 step 보정
# (Vic Pinky RPi RTC 배터리 없는 모델 대비)
makestep 1.0 3

# RTC 자동 갱신
rtcsync

# 로그 (선택)
logdir /var/log/chrony
