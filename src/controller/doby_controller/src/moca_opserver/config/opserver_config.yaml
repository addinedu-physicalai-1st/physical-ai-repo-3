# moca_opserver_config.yaml
# API spec: docs/moca_opserver_api_spec.md §6.1
#
# ROS parameter 형식 (ros2 launch 가 직접 로드).
# config 변경 시 opserver 노드 재기동 또는 POST /api/v1/config 로 일부 dynamic 갱신.

moca_opserver:
  ros__parameters:
    host: "0.0.0.0"
    port: 8800

    # patrol 자동 스케줄 (M2 본격 구현)
    patrol_interval_minutes: 5.0
    patrol_enabled: true
    business_hours: "09:00-22:00"

    # 안전 가드 임계
    battery_min: 0.20
    alarm_dwell_sec: 5.0

    # SetMode 응답 대기 timeout
    setmode_timeout_sec: 2.0

    # /mode/state 미수신 시 robot_offline 판정
    robot_offline_threshold_sec: 3.0

    # 활동 모드 자동 idle 복귀 dwell (CompletionWatcher, M2)
    completion_dwell_serving: 3.0
    completion_dwell_patrol: 1.0
    completion_dwell_guiding: 5.0
    completion_dwell_engaging: 2.0

    # 서빙 적재(Serve) 완료 후 자동 return 경로 복귀 → idle (route 서빙 전체)
    auto_return_after_serve: true
