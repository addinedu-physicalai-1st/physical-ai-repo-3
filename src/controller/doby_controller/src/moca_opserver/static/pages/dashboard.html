<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MOCA Dashboard</title>
  <link rel="stylesheet" href="/static/css/tokens.css?v=20260517r">
  <link rel="stylesheet" href="/static/css/reset.css?v=20260517r">
  <link rel="stylesheet" href="/static/css/layout.css?v=20260517r">
  <link rel="stylesheet" href="/static/css/components.css?v=20260517r">
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <h1>MoCa</h1>
        <p>Mobile Catering Snack Bar</p>
      </div>
      <nav class="sidebar__nav" aria-label="페이지 네비게이션">
        <a class="sidebar__nav-item sidebar__nav-item--active" href="/static/pages/dashboard.html">
          <span>대시보드</span>
        </a>
        <a class="sidebar__nav-item" href="/static/pages/modes.html"><span>모드 제어</span></a>
        <a class="sidebar__nav-item" href="/static/pages/tables.html"><span>테이블</span></a>
        <a class="sidebar__nav-item" href="/static/pages/events.html"><span>이벤트</span></a>
        <a class="sidebar__nav-item" href="/static/pages/analytics.html"><span>통계</span></a>
        <a class="sidebar__nav-item" href="/static/pages/settings.html"><span>설정</span></a>
        <a class="sidebar__nav-item" href="/static/pages/debug.html"><span>디버그</span></a>
      </nav>
      <div class="sidebar__status">
        <div class="sidebar__status-line">
          <span class="sidebar__status-dot" id="footer-dot"></span>
          <span id="footer-online">Doby…</span>
        </div>
        <div class="sidebar__status-line">
          <span class="label">BATT</span>
          <span id="footer-battery">—</span>
        </div>
      </div>
    </aside>

    <!-- Header -->
    <header class="header" id="header">
      <mode-badge></mode-badge>
      <battery-gauge></battery-gauge>
      <safety-indicator></safety-indicator>
      <robot-status name="Doby" store-key="online"></robot-status>
      <robot-status name="DDooby"></robot-status>
      <div class="header__right">
        <header-clock></header-clock>
      </div>
    </header>

    <!-- Main: 3 카드 + 평면도+빠른모드 + 이벤트 피드 -->
    <main class="main">

      <!-- 3 상태 카드 -->
      <div class="dashboard-grid">
        <div class="card">
          <h3>현재 모드</h3>
          <mode-badge></mode-badge>
          <p class="card__small" id="card-mode-entered">—</p>
        </div>
        <div class="card">
          <h3>진행 큐</h3>
          <p class="card__small">서빙: <span id="queue-serving-count">0</span> · 안내: <span id="queue-guiding-count">0</span></p>
          <ul class="queue-list" id="queue-serving"></ul>
        </div>
        <div class="card">
          <h3>다음 순회</h3>
          <p class="card__value" id="card-next-patrol">—</p>
          <p class="card__small" id="card-next-patrol-sub">idle 5분 후 자동 patrol</p>
        </div>
      </div>

      <!-- 평면도 + 빠른 모드 -->
      <div class="dashboard-main">
        <div class="card">
          <h3 class="card-head-flex">
            <span>매장 평면도</span>
            <button id="map-edit-btn" class="btn-map-edit" type="button"
                    title="가구 배치 편집기 (place_furniture_picker.py) 실행">MAP 편집</button>
          </h3>
          <floorplan-view></floorplan-view>
        </div>
        <div class="card">
          <h3>빠른 모드</h3>
          <mode-buttons></mode-buttons>
        </div>
      </div>

      <!-- 이벤트 피드 -->
      <div class="dashboard-feed card">
        <h3>실시간 이벤트 <a class="card__small" href="/static/pages/events.html" style="float:right">더보기</a></h3>
        <event-feed max="12"></event-feed>
      </div>

    </main>

  </div>

  <!-- JS — utils → ws → store → 컴포넌트 -->
  <script src="/static/js/utils.js?v=20260517r"></script>
  <script src="/static/js/ws.js?v=20260517r"></script>
  <script src="/static/js/store.js?v=20260517r"></script>
  <script src="/static/components/mode-badge.js?v=20260517r"></script>
  <script src="/static/components/battery-gauge.js?v=20260517r"></script>
  <script src="/static/components/safety-indicator.js?v=20260517r"></script>
  <script src="/static/components/robot-status.js?v=20260517r"></script>
  <script src="/static/components/header-clock.js?v=20260517r"></script>
  <script src="/static/components/floorplan-view.js?v=20260517r"></script>
  <script src="/static/components/mode-buttons.js?v=20260517r"></script>
  <script src="/static/components/event-feed.js?v=20260517r"></script>
  <script src="/static/js/toast.js?v=20260517r"></script>

  <script>
    // MAP 편집 버튼 → POST /api/v1/launch/map_picker (tkinter GUI subprocess)
    (function () {
      const btn = document.getElementById('map-edit-btn');
      if (!btn) return;
      btn.addEventListener('click', async (ev) => {
        ev.currentTarget.disabled = true;
        try {
          const r = await fetch('/api/v1/launch/map_picker',
            { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
          const j = await r.json();
          if (r.ok && j.ok) {
            const d = j.data || {};
            const pid = d.pid || (d.pids && d.pids[0]) || '?';
            const msg = d.status === 'already_running'
              ? `MAP 편집기 이미 실행 중 (PID ${pid})`
              : `MAP 편집기 실행 — PID ${pid}`;
            (window.toast || alert)(msg, 'info');
          } else {
            const err = (j.error && j.error.code) ? `${j.error.code}: ${j.error.message}` : '실행 실패';
            (window.toast || alert)(`MAP 편집기 ${err}`, 'err');
          }
        } catch (e) {
          (window.toast || alert)(`MAP 편집기 요청 실패: ${e.message}`, 'err');
        } finally {
          setTimeout(() => { btn.disabled = false; }, 800);
        }
      });
    })();
  </script>

  <script>
    (function () {
      const dot = document.getElementById('footer-dot');
      const online = document.getElementById('footer-online');
      const batt = document.getElementById('footer-battery');
      const header = document.getElementById('header');
      const modeEntered = document.getElementById('card-mode-entered');
      const queueServing = document.getElementById('queue-serving');
      const queueServingCount = document.getElementById('queue-serving-count');
      const queueGuidingCount = document.getElementById('queue-guiding-count');
      const nextPatrol = document.getElementById('card-next-patrol');
      const nextPatrolSub = document.getElementById('card-next-patrol-sub');

      // 헤더/사이드바 footer 갱신
      store.on('online', (on) => {
        if (on) {
          dot.classList.add('sidebar__status-dot--online');
          online.textContent = 'Doby Online';
          header.classList.remove('header--offline');
        } else {
          dot.classList.remove('sidebar__status-dot--online');
          online.textContent = 'Doby Offline';
          header.classList.add('header--offline');
        }
      });
      store.on('battery', (b) => {
        if (b && typeof b.percentage === 'number' && b.percentage >= 0) {
          batt.textContent = `${Math.round(b.percentage * 100)}%`;
        } else { batt.textContent = '—'; }
      });

      // 현재 모드 카드 진입 시각
      store.on('mode', (m) => {
        if (!m) return;
        const rel = utils.formatRelative(m.entered_at);
        modeEntered.textContent = m.entered_at
          ? `진입: ${utils.formatTime(m.entered_at)} (${rel} 경과)`
          : '진입 시각: —';
      });

      // 서빙/안내 큐 표시
      function renderQueues() {
        const snap = store.get('welcome');
        const q = (snap && snap.snapshot && snap.snapshot.queue) || {};
        const serving = q.serving || [];
        const guiding = q.guiding || [];
        queueServingCount.textContent = serving.length;
        queueGuidingCount.textContent = guiding.length;
        if (serving.length === 0) {
          queueServing.innerHTML = '<li class="queue-empty">큐 비어있음</li>';
        } else {
          queueServing.innerHTML = serving
            .map(s => `<li>${s.drink_id || s.order_id || "?"} → ${s.target_table || "?"}</li>`)
            .join("");
        }
      }
      store.on('welcome', renderQueues);
      // serving_progress 가 큐를 직접 갱신하지 않으므로 일단 welcome snapshot 기준

      // 다음 순회 카운트다운 — IdlePatrolTimer 의 idle dwell
      // (M3 stretch: opserver 가 idle_elapsed_sec 을 broadcast)
      const PATROL_INTERVAL_SEC = 5 * 60;
      let modeEnteredTs = null;
      store.on('mode', (m) => {
        if (m && m.current === 'idle' && m.entered_at) {
          modeEnteredTs = new Date(m.entered_at).getTime();
        } else {
          modeEnteredTs = null;
        }
      });
      setInterval(() => {
        if (modeEnteredTs === null) {
          nextPatrol.textContent = '—';
          nextPatrolSub.textContent = '활동 모드 중';
          return;
        }
        const elapsed = (Date.now() - modeEnteredTs) / 1000;
        const remain = PATROL_INTERVAL_SEC - elapsed;
        if (remain <= 0) {
          nextPatrol.textContent = '곧';
          nextPatrolSub.textContent = '곧 자동 patrol 트리거';
        } else {
          const m = Math.floor(remain / 60);
          const s = Math.floor(remain % 60);
          nextPatrol.textContent = `${m}:${String(s).padStart(2,'0')}`;
          nextPatrolSub.textContent = '뒤 자동 patrol (설정 변경 가능)';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
