# vic_pinky 서빙 모드 — 테이블 waypoint 등록
#
# 좌표는 mapv5_mocamap (config/cafe_layout.yaml 의 picker 배치) 에서 도출.
# frame_id 는 모두 'map' (mapv5_mocamap 기준, Nav2 map_server SoT).
#
# 시드 출처: config/cafe_layout.yaml (2026-05-15 picker 저장본 — 가구 (-2.625, +1.975) m
#   shift 후 + 키오스크/배너 신설 + 일부 미세조정 반영).
#   - tables T01~T05: cafe_table 가구 중심 (x, y, yaw=0)
#   - home_pose: pinky_home (-36.953, 2.859, yaw=-π/2)
# yaw=0 의미: CLAUDE.md / 2026-05-14 회고 §발견 의 "옵션 C" — 가구 yaw 를
#   waypoint heading 으로 재정의. 모든 테이블 정면 = +x 방향.
#   실 라이브에서 점주가 RViz `2D Pose Estimate` 로 재캡처 권장 (테이블별 진입 방향
#   고려 시 yaw 조정 필요할 가능성 큼).
#
# 갱신 절차 (시뮬):
#   1. Gazebo: ROS_DOMAIN_ID=99 ROS_LOCALHOST_ONLY=1 \
#        ros2 launch moca_gazebo launch_mapv5_moca.launch.xml
#   2. Nav2 launch + AMCL + mapv5_mocamap.yaml
#   3. RViz `2D Pose Estimate` 로 테이블 앞 정차 pose 클릭 → 본 파일 수동 갱신
#   4. dispatcher /serving/reload_tables (std_srvs/Trigger) 또는 재기동
#
# approach_dist: 테이블 면 앞 정지 offset (m). dispatcher 가 pose yaw 방향 backward
#   로 approach_dist 만큼 물러난 지점을 Nav2 goal 로 보냄. 테이블 충돌 방지.
#   0.5m 시드 — 가구 cafe_table 깊이 0.7m × 0.7m 의 절반(0.35) + 안전 마진(0.15).

home_pose:
  frame_id: map
  # 2026-05-17 (저녁) — dock vs staging 분리. home_pose = staging (Nav2 시작/종료).
  # dock (-36.98, 2.649) 는 cafe_layout.yaml pinky_home 에 별 entry. 후속 dock action 사용.
  x: -36.98
  y: 2.0
  yaw: -1.571           # -π/2, 카운터 정면 향함
  description: "pinky_home — bar_counter 옆 idle 위치 (서빙 mode 진입/종료 시 시작/복귀 지점)"

tables:
# pose 자체가 robot 정차 좌표 (테이블 옆 통로). approach_dist=0.0 (좌표 자체 = 정차 pose).
# 2026-05-26 — 정밀 주차(opennav_docking) 전환: dispatcher 가 이 pose 를 DockRobot 의
#   dock_pose(use_dock_id=false)로 직접 전달. docking_server 가 pose 뒤 staging_x_offset(-0.7m)
#   지점에 staging 후 pose 까지 odom 서보 → 최종 base_link ≈ pose. 두 전제 sim 확인 필요:
#   (1) yaw 가 테이블을 향함(접근 방향), (2) pose 뒤 0.7m staging 여유공간 존재.
#   주의: dispatcher 는 더 이상 approach_dist 를 쓰지 않음 (staging offset 은 별개 개념, docking_server param).
# 2026-05-17 갱신 — cafe_layout.yaml tables 섹션 sync (place_furniture_picker.py 등록값).
- id: T01
  pose:
    frame_id: map
    x: -37.12
    y: 0.543
    yaw: -1.57
  approach_dist: 0.0
  description: "T01 — 카운터 정남 단독, robot 정차 yaw=-π/2 (남쪽 향함)"

- id: T02
  pose:
    frame_id: map
    x: -40.303
    y: -0.591
    yaw: 1.571
  approach_dist: 0.0
  description: "T02 — 중앙 그룹 남쪽, robot 정차 yaw=+π/2 (북쪽 향함)"

- id: T03
  pose:
    frame_id: map
    x: -40.287
    y: 0.276
    yaw: 1.571
  approach_dist: 0.0
  description: "T03 — 중앙 그룹 북쪽, robot 정차 yaw=+π/2 (북쪽 향함)"

- id: T04
  pose:
    frame_id: map
    x: -45.620
    y: -0.021
    yaw: -1.572
  approach_dist: 0.0
  description: "T04 — 서쪽 그룹 북쪽, robot 정차 yaw=-π/2 (남쪽 향함). 2026-05-26 현재 로봇 pose 로 재캡처 (tf2_echo map base_footprint)"

- id: T05
  pose:
    frame_id: map
    x: -45.629
    y: -0.716
    yaw: -1.584
  approach_dist: 0.0
  description: "T05 — 서쪽 그룹 남쪽, robot 정차 yaw=-π/2 (남쪽 향함). 2026-05-26 현재 로봇 pose 로 재캡처 (tf2_echo map base_footprint)"
