# velocity_smoother_sim.yaml — Gazebo cmd_vel 안전 체인용 후단 smoother
#
# topology:
#   /bt/cmd_vel -> velocity_smoother -> /cmd_vel_smoothed
#                              -> collision_monitor -> /cmd_vel

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [0.3, 0.0, 1.5]
    max_decel: [-0.8, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
