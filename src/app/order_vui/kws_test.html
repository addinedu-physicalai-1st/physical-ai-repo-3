<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>KWS ort-web 호환 검증</title>
<style>
  body { font-family: ui-monospace, Menlo, Consolas, monospace; background:#111; color:#eee; padding:24px; line-height:1.5; }
  h1 { color:#9cf; margin-top:0; }
  .step { padding:10px 14px; margin:8px 0; border-left:4px solid #555; background:#1b1b1b; white-space:pre-wrap; }
  .step.ok { border-color:#3c3; }
  .step.fail { border-color:#f55; }
  .step.run { border-color:#fc3; }
  button { background:#246; color:#fff; border:0; padding:10px 18px; font-size:16px; cursor:pointer; margin-bottom:14px; }
  .label { color:#9cf; font-weight:600; }
</style>
</head>
<body>
<h1>KWS ort-web 호환 검증</h1>
<button id="run">검증 시작</button>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<script>
const MODELS_BASE = '/order_vui/shared/models';
const logEl = document.getElementById('log');

function logStep(title, status, detail) {
  const div = document.createElement('div');
  div.className = 'step ' + (status || 'run');
  div.innerHTML = `<span class="label">${status === 'ok' ? '[OK]' : status === 'fail' ? '[FAIL]' : '[..]'} ${title}</span>\n${detail ?? ''}`;
  logEl.appendChild(div);
  return div;
}

async function fetchBuf(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`fetch ${path} -> HTTP ${r.status}`);
  return new Uint8Array(await r.arrayBuffer());
}

function describeIO(session) {
  const lines = [];
  lines.push('  inputs:');
  for (const name of session.inputNames) {
    const meta = session.inputMetadata ? session.inputMetadata[name] : null;
    lines.push(`    ${name}` + (meta ? `  type=${meta.type}  dims=[${(meta.dimensions || []).join(',')}]` : ''));
  }
  lines.push('  outputs:');
  for (const name of session.outputNames) {
    const meta = session.outputMetadata ? session.outputMetadata[name] : null;
    lines.push(`    ${name}` + (meta ? `  type=${meta.type}  dims=[${(meta.dimensions || []).join(',')}]` : ''));
  }
  return lines.join('\n');
}

async function loadSession(label, modelPath, externalDataPaths) {
  const step = logStep(`load ${label}`, 'run', `path=${modelPath}`);
  try {
    const modelBuf = await fetchBuf(modelPath);
    const externalData = [];
    for (const ext of externalDataPaths || []) {
      const buf = await fetchBuf(ext.url);
      externalData.push({ path: ext.path, data: buf });
    }
    const opts = { executionProviders: ['wasm'] };
    if (externalData.length) opts.externalData = externalData;
    const session = await ort.InferenceSession.create(modelBuf, opts);
    step.className = 'step ok';
    step.innerHTML = `<span class="label">[OK] load ${label}</span>\n  modelSize=${modelBuf.byteLength}B\n${describeIO(session)}`;
    return session;
  } catch (e) {
    step.className = 'step fail';
    step.innerHTML = `<span class="label">[FAIL] load ${label}</span>\n  ${e?.message || e}\n  ${e?.stack || ''}`;
    throw e;
  }
}

async function runDummy(label, session, makeInputs) {
  const step = logStep(`infer ${label}`, 'run', '');
  try {
    const feeds = makeInputs();
    const t0 = performance.now();
    const out = await session.run(feeds);
    const t1 = performance.now();
    const outDesc = Object.entries(out).map(([k, v]) => {
      const arr = v.data;
      const preview = arr.length > 8 ? Array.from(arr.slice(0, 8)).map(x => +Number(x).toFixed(4)).join(', ') + ' ...' : Array.from(arr).map(x => +Number(x).toFixed(4)).join(', ');
      return `    ${k}  type=${v.type}  dims=[${v.dims.join(',')}]  preview=[${preview}]`;
    }).join('\n');
    step.className = 'step ok';
    step.innerHTML = `<span class="label">[OK] infer ${label}</span>\n  latency=${(t1 - t0).toFixed(2)}ms\n  outputs:\n${outDesc}`;
    return out;
  } catch (e) {
    step.className = 'step fail';
    step.innerHTML = `<span class="label">[FAIL] infer ${label}</span>\n  ${e?.message || e}\n  ${e?.stack || ''}`;
    throw e;
  }
}

async function main() {
  logEl.innerHTML = '';
  logStep('ort version', 'ok', `  ${ort.env.versions ? JSON.stringify(ort.env.versions) : 'unknown'}\n  wasm threads supported: ${typeof SharedArrayBuffer !== 'undefined'}`);
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.simd = true;

  let mel, emb, kws;
  try {
    mel = await loadSession('melspectrogram.onnx', `${MODELS_BASE}/melspectrogram.onnx`);
    emb = await loadSession('embedding_model.onnx', `${MODELS_BASE}/embedding_model.onnx`);
    kws = await loadSession('kws_v1.onnx', `${MODELS_BASE}/kws_v1.onnx`, [
      { path: 'kws_v1.onnx.data', url: `${MODELS_BASE}/kws_v1.onnx.data` },
    ]);
  } catch {
    logStep('summary', 'fail', '하나 이상의 모델이 로드 실패. 위 에러 메시지를 보고 op 미지원 / 외부 데이터 경로 / WASM 백엔드 호환성 확인 필요.');
    return;
  }

  // melspectrogram: openwakeword 표준 입력은 (1, 1280) float32 PCM (정규화 X, int16 -> float32 그대로 사용)
  // 더미 입력으로 우선 실행해 본다.
  let melOut;
  try {
    melOut = await runDummy('melspectrogram', mel, () => {
      const data = new Float32Array(1280);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() - 0.5) * 16384;
      return { [mel.inputNames[0]]: new ort.Tensor('float32', data, [1, 1280]) };
    });
  } catch {}

  // embedding: openwakeword 표준 입력 (1, 76, 32, 1) — mel 76 frames, 32 bins
  let embOut;
  try {
    embOut = await runDummy('embedding', emb, () => {
      const inputName = emb.inputNames[0];
      const meta = emb.inputMetadata?.[inputName];
      const dims = meta?.dimensions || [1, 76, 32, 1];
      const concrete = dims.map(d => (typeof d === 'number' && d > 0 ? d : 1));
      const size = concrete.reduce((a, b) => a * b, 1);
      const data = new Float32Array(size);
      for (let i = 0; i < size; i++) data[i] = Math.random();
      return { [inputName]: new ort.Tensor('float32', data, concrete) };
    });
  } catch {}

  // kws_v1: openwakeword 표준 입력 (1, 16, 96) — 16 frames of 96-dim embedding
  let kwsOut;
  try {
    kwsOut = await runDummy('kws_v1', kws, () => {
      const inputName = kws.inputNames[0];
      const meta = kws.inputMetadata?.[inputName];
      const dims = meta?.dimensions || [1, 16, 96];
      const concrete = dims.map(d => (typeof d === 'number' && d > 0 ? d : 1));
      const size = concrete.reduce((a, b) => a * b, 1);
      const data = new Float32Array(size);
      for (let i = 0; i < size; i++) data[i] = Math.random() * 0.1;
      return { [inputName]: new ort.Tensor('float32', data, concrete) };
    });
  } catch {}

  const allOk = melOut && embOk(embOut) && kwsOut;
  function embOk(x){ return !!x; }
  logStep('summary', allOk ? 'ok' : 'fail',
    allOk
      ? 'KWS 파이프라인 3개 모델 모두 onnxruntime-web 에서 로드/추론 성공.\nPhase 1 본 작업(AudioWorklet + 실제 마이크 PCM → 모델 체인) 진행 가능.'
      : '일부 단계 실패. 위 [FAIL] 박스를 확인하세요.');
}

document.getElementById('run').addEventListener('click', () => { main().catch(e => console.error(e)); });
</script>
</body>
</html>
