services:
  moca_service:
    build:
      context: ./moca_service
    container_name: moca_service
    ports:
      - "9001:9001"
    environment:
      MOCA_SERVICE_NAME: moca_service
      MOCA_SERVICE_PORT: "9001"
      BUSINESS_SERVICE_DB_HOST: moca_db
      BUSINESS_SERVICE_DB_PORT: "3306"
      BUSINESS_SERVICE_ADMIN_GUI_HOST: ${ADMIN_GUI_HOST:-host.docker.internal}
      BUSINESS_SERVICE_ADMIN_GUI_PORT: ${ADMIN_GUI_PORT:-9000}
      BUSINESS_SERVICE_WEB_SERVICE_HOST: web_service
      BUSINESS_SERVICE_WEB_SERVICE_TCP_PORT: "9004"
      CONTROL_SERVICE_ADMIN_GUI_HOST: ${ADMIN_GUI_HOST:-host.docker.internal}
      CONTROL_SERVICE_ADMIN_GUI_PORT: ${ADMIN_GUI_PORT:-9000}
      CONTROL_SERVICE_COOKING_CONTROLLER_BRIDGE_HOST: ${COOKING_CONTROLLER_BRIDGE_HOST:-host.docker.internal}
      CONTROL_SERVICE_COOKING_CONTROLLER_BRIDGE_PORT: ${COOKING_CONTROLLER_BRIDGE_PORT:-9005}
      CONTROL_SERVICE_SERVING_CONTROLLER_BRIDGE_HOST: ${SERVING_CONTROLLER_BRIDGE_HOST:-host.docker.internal}
      CONTROL_SERVICE_SERVING_CONTROLLER_BRIDGE_PORT: ${SERVING_CONTROLLER_BRIDGE_PORT:-9006}
      CONTROL_SERVICE_VISION_SERVICE_HOST: ${VISION_SERVICE_HOST:-ai-server.local}
      CONTROL_SERVICE_VISION_SERVICE_TCP_PORT: ${VISION_SERVICE_TCP_PORT:-9003}
      CONTROL_SERVICE_ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      moca_db:
        condition: service_healthy

  web_service:
    build:
      context: ./web_service
    container_name: web_service
    ports:
      - "8000:8000"
      - "9004:9004"
    environment:
      WEB_SERVICE_HTTP_PORT: "8000"
      WEB_SERVICE_TCP_PORT: "9004"
      WEB_SERVICE_BUSINESS_SERVICE_HOST: moca_service
      WEB_SERVICE_BUSINESS_SERVICE_PORT: "9001"
    volumes:
      - ../app/order_vui:/app/ui/order_vui:ro
      - ../app/table_gui:/app/ui/table_gui:ro

  moca_db:
    image: mysql:8.4
    container_name: moca_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: business
      MYSQL_USER: business_user
      MYSQL_PASSWORD: business_password
    volumes:
      - moca_db_data:/var/lib/mysql
      - ./moca_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  moca_db_data:
