services:
  web_service:
    build:
      context: ./web_service
    container_name: web_service
    ports:
      - "8000:8000"
      - "9004:9004"
    environment:
      WEB_SERVICE_NAME: web_service
      WEB_SERVICE_HTTP_PORT: "8000"
      WEB_SERVICE_TCP_PORT: "9004"
      MOCA_SERVICE_HOST: host.docker.internal
      MOCA_SERVICE_PORT: "9001"
      # 폰의 getUserMedia (마이크) 는 secure context 만 허용해 https 가 필요.
      # mkcert 등으로 발급한 self-signed 인증서를 ./certs 에 두고 .env 에 경로 지정 시 HTTPS,
      # 변수 미지정 (다른 로컬에서 clone) 시 HTTP 로 폴백.
      WEB_SERVICE_SSL_CERT: ${WEB_SERVICE_SSL_CERT:-}
      WEB_SERVICE_SSL_KEY: ${WEB_SERVICE_SSL_KEY:-}
    volumes:
      - ../app/order_vui:/app/ui/order_vui:ro
      - ../app/table_gui:/app/ui/table_gui:ro
      - ./certs:/certs:ro

  moca_db:
    image: mysql:8.4
    container_name: moca_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: business
      MYSQL_USER: business_user
      MYSQL_PASSWORD: business_password
    volumes:
      - moca_db_data:/var/lib/mysql
      - ./moca_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE} -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  moca_db_data:
