services:
  vision_service:
    build:
      context: ./vision_service
    container_name: vision_service
    ports:
      - "9003:9003"
      - "9103:9103/udp"
    environment:
      VISION_SERVICE_TCP_PORT: "9003"
      VISION_SERVICE_UDP_PORT: "9103"
      VISION_SERVICE_CONTROL_SERVICE_HOST: ${CONTROL_SERVICE_HOST:-operation-server.local}
      VISION_SERVICE_CONTROL_SERVICE_PORT: ${CONTROL_SERVICE_PORT:-9001}
