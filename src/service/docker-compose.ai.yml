services:
  voice_service:
    build:
      context: ./voice_service
    container_name: voice_service
    ports:
      - "8010:8010"
    environment:
      VOICE_SERVICE_NAME: voice_service
      VOICE_SERVICE_HTTP_PORT: "8010"
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface
      # 폰 마이크 권한 위해 voice_service 도 https 로 종단 (web_service 와 같은 mkcert 인증서 공유).
      VOICE_SERVICE_SSL_CERT: /certs/cert.pem
      VOICE_SERVICE_SSL_KEY: /certs/key.pem
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./certs:/certs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf_cache: {}
